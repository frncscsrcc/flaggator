[project]
name = "flaggator"
version = "1.1.0"
description = "A locally deployable, API-first feature-flag service."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
mysql = ["PyMySQL"]

[project.scripts]
flaggator = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["composition", "main"]

[tool.setuptools.packages.find]
where = ["src"]
