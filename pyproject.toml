[project]
name = "flaggator"
version = "1.2.0"
description = "A locally deployable, API-first feature-flag service."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
# PyJWT is MIT. The crypto extra installs cryptography (Apache-2.0 / BSD).
dependencies = [
    "PyJWT[crypto]>=2.10.1,<3",
]

[project.optional-dependencies]
# PyMySQL is MIT.
mysql = ["PyMySQL>=1.1.1,<2"]

[project.scripts]
flaggator = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["composition", "main"]

[tool.setuptools.packages.find]
where = ["src"]
