openapi: 3.0.3
info:
  title: flaggator
  version: 0.0.0
  description: |
    HTTP API for the flaggator feature-flag service. This file lists the
    routes the process serves. docs/api.md is the design contract for routes
    that are not implemented yet. Update this file in the same change as a
    route, a request body, or a response body.

    Audit reads are not in this file yet.
servers:
  - url: http://127.0.0.1:8080
    description: Default bind address
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Projects
  - name: Environments
  - name: Flags
  - name: Targeting
  - name: SDK keys
  - name: Evaluation
paths:
  /health:
    get:
      tags: [Health]
      summary: Process is up
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The process is answering. The database was not checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of projects, ordered by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedCreate"
      responses:
        "201":
          description: The stored project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}:
    get:
      tags: [Projects]
      summary: Fetch one project
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/environments:
    get:
      tags: [Environments]
      summary: List environments
      operationId: listEnvironments
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of environments in the project, ordered by key. Secrets are absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
    post:
      tags: [Environments]
      summary: Create an environment
      operationId: createEnvironment
      description: |
        Does not copy targeting from another environment. Each flag already
        in the project gets a disabled configuration with off variation 0
        and fallthrough variation 0.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedCreate"
      responses:
        "201":
          description: The stored environment. The SDK secret is not included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/flags:
    get:
      tags: [Flags]
      summary: List flags
      operationId: listFlags
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: environment
          in: query
          required: false
          description: When set, each item includes that environment's configuration summary. An unknown environment is 404.
          schema:
            $ref: "#/components/schemas/PublicKey"
      responses:
        "200":
          description: One page of flags, ordered by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
    post:
      tags: [Flags]
      summary: Create a flag
      operationId: createFlag
      description: |
        Stores the variations in array order, starting at index 0, and a
        disabled configuration in every existing environment.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagCreate"
      responses:
        "201":
          description: The stored flag, including every environment configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/flags/{flagKey}:
    get:
      tags: [Flags]
      summary: Fetch one flag
      operationId: getFlag
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/FlagKey"
      responses:
        "200":
          description: The flag, its variations, and every environment configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
    patch:
      tags: [Flags]
      summary: Patch a flag
      operationId: patchFlag
      description: |
        Updates name and description. When variations is sent, it is the full
        ordered list and must start with the stored variations. Values after
        that prefix are appended. A shorter list, a different prefix, or a
        key field is 400. Existing environment configurations keep their indexes.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/FlagKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagPatch"
      responses:
        "200":
          description: The stored flag after the patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/flags/{flagKey}/environments/{environmentKey}:
    get:
      tags: [Targeting]
      summary: Fetch targeting for one flag in one environment
      operationId: getTargeting
      description: |
        Returns the stored configuration, including version. The environment
        key is the path, not a field of the body. Management reads come from
        SQL, not from the evaluation cache.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/FlagKey"
        - $ref: "#/components/parameters/EnvironmentKey"
      responses:
        "200":
          description: The stored targeting document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Targeting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
    put:
      tags: [Targeting]
      summary: Replace targeting
      operationId: replaceTargeting
      description: |
        Replaces the whole document. version is the version returned by the
        last fetch. Success stores version + 1. A different stored version
        is 409 and does not change the row. Omit a rule id to create a rule;
        the service assigns the id. Send a stored id to keep that rule. Omit
        a rollout salt to keep the stored salt, or to have one assigned for
        a new rollout. Sending a different salt reshuffles that rollout.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/FlagKey"
        - $ref: "#/components/parameters/EnvironmentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Targeting"
      responses:
        "200":
          description: The stored targeting document, with version incremented by one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Targeting"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: The configuration version is stale. The stored document was not changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: conflict
                  message: The configuration version is stale.
                  details: []
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/environments/{environmentKey}/sdk-keys:
    get:
      tags: [SDK keys]
      summary: List SDK keys
      operationId: listSdkKeys
      description: Active keys only. Secrets are absent.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/EnvironmentKey"
      responses:
        "200":
          description: The active SDK keys. An environment with none returns an empty items list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeyPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
    post:
      tags: [SDK keys]
      summary: Create an SDK key
      operationId: createSdkKey
      description: The body is an empty object. The secret is returned once and is not written to the audit log.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/EnvironmentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "201":
          description: The new key. secret will not be returned again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSdkKey"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/environments/{environmentKey}/sdk-keys/{keyId}:
    delete:
      tags: [SDK keys]
      summary: Revoke an SDK key
      operationId: revokeSdkKey
      description: A missing, already revoked, or wrong-environment id is 404. The next evaluation with that secret is 401.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/EnvironmentKey"
        - $ref: "#/components/parameters/SdkKeyId"
      responses:
        "204":
          description: The key is revoked. The body is an empty object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyObject"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/projects/{projectKey}/environments/{environmentKey}/evaluation-config:
    get:
      tags: [Evaluation]
      summary: Read the evaluation bundle
      operationId: readEvaluationConfig
      description: |
        Variation lists and targeting, including salts. Secrets are absent.
        An SDK key may read only its own environment. This document is the
        evaluation cache payload.
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/EnvironmentKey"
      responses:
        "200":
          description: The flags in this environment, ordered by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationBundle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/evaluate:
    post:
      tags: [Evaluation]
      summary: Evaluate one flag
      operationId: evaluateOne
      description: |
        A management token must send project_key and environment_key. An SDK
        key may omit them and uses its bound environment. A sent key that
        does not match the SDK key is 403. An unknown flag is still 200,
        with the caller default and reason flag_not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateOne"
      responses:
        "200":
          description: The decision, including when the flag does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
  /v1/evaluate-all:
    post:
      tags: [Evaluation]
      summary: Evaluate every flag
      operationId: evaluateAll
      description: |
        Same credential rules as evaluate one. There is no default. Flags
        that do not exist are absent. Decisions are ordered by flag key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateAll"
      responses:
        "200":
          description: One decision per flag. An environment with no flags returns an empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/StorageError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque management token or SDK key. A JWT is not accepted. An SDK key receives 403 on management routes.
  parameters:
    ProjectKey:
      name: projectKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicKey"
    FlagKey:
      name: flagKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicKey"
    EnvironmentKey:
      name: environmentKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicKey"
    SdkKeyId:
      name: keyId
      in: path
      required: true
      description: Decimal credential id, with no leading zero.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50. Values outside 1 to 200 are 400.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page. Clients do not construct it. A missing cursor starts at the first key.
      schema:
        type: string
  responses:
    ValidationError:
      description: The request shape or a domain rule was rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: The key is not valid.
              details:
                - field: key
                  message: Use lowercase letters, digits, and single hyphens.
    Unauthenticated:
      description: The credential is missing, unknown, or revoked. The message is the same for all three.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: A valid credential is required.
              details: []
    Forbidden:
      description: The credential is valid and may not call this route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: The credential may not call this route.
              details: []
    NotFound:
      description: The project, environment, or flag does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Project does not exist.
              details: []
    Conflict:
      description: The key already exists, or the configuration version is stale.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: Flag key already exists.
              details: []
    MethodNotAllowed:
      description: The path exists and does not implement this method.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: This route accepts GET.
              details: []
    StorageError:
      description: The database failed. The message does not include driver text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: storage_error
              message: The database failed to complete the request.
              details: []
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - storage_error
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    PublicKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      description: Lowercase letters, digits, and single hyphens. No leading or trailing hyphen.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 256
      description: Must not be empty or have leading or trailing spaces.
    Project:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        name:
          $ref: "#/components/schemas/DisplayName"
    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: string
          nullable: true
          description: Null when this page is the last one.
    Environment:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        name:
          $ref: "#/components/schemas/DisplayName"
    EnvironmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        next_cursor:
          type: string
          nullable: true
    NamedCreate:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        name:
          $ref: "#/components/schemas/DisplayName"
    VariationValue:
      description: A JSON boolean, number, string, array, or object. Null is not allowed anywhere in the value. The encoded value is at most 16 KiB.
      oneOf:
        - type: boolean
        - type: number
        - type: string
        - type: array
          items: {}
        - type: object
    Serve:
      description: "Either {\"variation\": <index>} or a rollout."
      oneOf:
        - $ref: "#/components/schemas/VariationServe"
        - $ref: "#/components/schemas/RolloutServe"
    VariationServe:
      type: object
      required: [variation]
      additionalProperties: false
      properties:
        variation:
          type: integer
          minimum: 0
    RolloutServe:
      type: object
      required: [rollout]
      additionalProperties: false
      properties:
        rollout:
          $ref: "#/components/schemas/Rollout"
    Rollout:
      type: object
      required: [variations]
      additionalProperties: false
      properties:
        salt:
          type: string
          minLength: 1
          description: Present on every stored rollout. Omit it on write to keep the stored salt, or to have one assigned for a new rollout.
        variations:
          type: array
          minItems: 1
          description: Non-negative integer weights that sum to 100000.
          items:
            $ref: "#/components/schemas/RolloutWeight"
    RolloutWeight:
      type: object
      required: [variation_index, weight]
      additionalProperties: false
      properties:
        variation_index:
          type: integer
          minimum: 0
        weight:
          type: integer
          minimum: 0
    Clause:
      type: object
      required: [attribute, operator, values]
      additionalProperties: false
      properties:
        attribute:
          type: string
          minLength: 1
          maxLength: 64
        operator:
          type: string
          enum: [eq, neq, in, not_in, starts_with, ends_with, contains, gt, gte, lt, lte]
        values:
          type: array
          maxItems: 50
          items: {}
          description: eq, gt, gte, lt, and lte take one value. The other operators take at least one.
    Rule:
      type: object
      required: [clauses, serve]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Assigned by the service. Omit it to create a rule. Send a stored id to keep that rule.
        clauses:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Clause"
        serve:
          $ref: "#/components/schemas/Serve"
    Prerequisite:
      type: object
      required: [flag_key, variation_index]
      additionalProperties: false
      properties:
        flag_key:
          $ref: "#/components/schemas/PublicKey"
        variation_index:
          type: integer
          minimum: 0
    Targeting:
      type: object
      required:
        - enabled
        - off_variation
        - fallthrough
        - rules
        - targets
        - prerequisites
        - version
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        off_variation:
          type: integer
          minimum: 0
        fallthrough:
          $ref: "#/components/schemas/Serve"
        rules:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Rule"
        targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Keys are variation indexes as decimal strings, with no leading zero. The lists do not share a context key. At most 1000 keys in total.
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/Prerequisite"
        version:
          type: integer
          minimum: 1
          description: The version returned by the last fetch of this configuration.
    FlagConfig:
      type: object
      required:
        - key
        - enabled
        - off_variation
        - fallthrough
        - rules
        - targets
        - prerequisites
        - version
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        enabled:
          type: boolean
        off_variation:
          type: integer
          minimum: 0
        fallthrough:
          $ref: "#/components/schemas/Serve"
        rules:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Rule"
        targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Keys are variation indexes as decimal strings, with no leading zero. The lists do not share a context key. At most 1000 keys in total.
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/Prerequisite"
        version:
          type: integer
          minimum: 1
    FlagConfigSummary:
      type: object
      required: [key, enabled, off_variation, version]
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        enabled:
          type: boolean
        off_variation:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
    Flag:
      type: object
      required: [key, name, description, variations, environments]
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        name:
          $ref: "#/components/schemas/DisplayName"
        description:
          type: string
          description: May be empty. At most 65535 bytes.
        variations:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: "#/components/schemas/VariationValue"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/FlagConfig"
    FlagSummary:
      type: object
      required: [key, name, description, variations]
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        name:
          $ref: "#/components/schemas/DisplayName"
        description:
          type: string
        variations:
          type: array
          items:
            $ref: "#/components/schemas/VariationValue"
        environment:
          $ref: "#/components/schemas/FlagConfigSummary"
          description: Present only when the list query named an environment.
    FlagPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlagSummary"
        next_cursor:
          type: string
          nullable: true
    FlagCreate:
      type: object
      required: [key, name, description, variations]
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        name:
          $ref: "#/components/schemas/DisplayName"
        description:
          type: string
        variations:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: "#/components/schemas/VariationValue"
    FlagPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/DisplayName"
        description:
          type: string
        variations:
          type: array
          minItems: 2
          maxItems: 20
          description: The full ordered list. It must start with the stored variations.
          items:
            $ref: "#/components/schemas/VariationValue"
    EmptyObject:
      type: object
      additionalProperties: false
    SdkKeyPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SdkKey"
    SdkKey:
      type: object
      required: [id, prefix, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        prefix:
          type: string
          minLength: 8
          maxLength: 8
        created_at:
          type: string
    IssuedSdkKey:
      allOf:
        - $ref: "#/components/schemas/SdkKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Returned once. Not stored in the audit log.
    EvaluationBundle:
      type: object
      required: [project_key, environment_key, flags]
      additionalProperties: false
      properties:
        project_key:
          $ref: "#/components/schemas/PublicKey"
        environment_key:
          $ref: "#/components/schemas/PublicKey"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationFlag"
    EvaluationFlag:
      type: object
      required:
        - key
        - variations
        - enabled
        - off_variation
        - fallthrough
        - rules
        - targets
        - prerequisites
        - version
      additionalProperties: false
      properties:
        key:
          $ref: "#/components/schemas/PublicKey"
        variations:
          type: array
          items:
            $ref: "#/components/schemas/VariationValue"
        enabled:
          type: boolean
        off_variation:
          type: integer
          minimum: 0
        fallthrough:
          $ref: "#/components/schemas/Serve"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/Prerequisite"
        version:
          type: integer
          minimum: 1
    EvaluateOne:
      type: object
      required: [flag_key, context, default]
      additionalProperties: false
      properties:
        project_key:
          $ref: "#/components/schemas/PublicKey"
        environment_key:
          $ref: "#/components/schemas/PublicKey"
        flag_key:
          type: string
        context:
          $ref: "#/components/schemas/Context"
        default:
          description: Any JSON value. Used only when the flag does not exist.
    EvaluateAll:
      type: object
      required: [context]
      additionalProperties: false
      properties:
        project_key:
          $ref: "#/components/schemas/PublicKey"
        environment_key:
          $ref: "#/components/schemas/PublicKey"
        context:
          $ref: "#/components/schemas/Context"
    Context:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 1024
        attributes:
          type: object
          maxProperties: 50
          additionalProperties: true
          description: At most 50 names, each 1 to 64 characters. Values are scalars or arrays of scalars.
    Decision:
      type: object
      required: [flag_key, value, variation_index, reason, rule_id, version]
      additionalProperties: false
      properties:
        flag_key:
          type: string
        value: {}
        variation_index:
          type: integer
          nullable: true
        reason:
          type: string
          enum:
            - off
            - prerequisite_failed
            - target_match
            - rule_match
            - fallthrough
            - flag_not_found
        rule_id:
          type: string
          nullable: true
        version:
          type: integer
          nullable: true
    DecisionList:
      type: object
      required: [decisions]
      additionalProperties: false
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
